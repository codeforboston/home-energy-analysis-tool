# Setup (run from the repository root). See CONTRIBUTING.md for details.
#   uv sync
#   uv sync --directory python --extra dev
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#   cd heat-stack && npm install && cd ..
#
# black and isort run in pre-commit's own environments, pinned by `rev`.
# mypy and pytest run through `uv run --directory python`.
# prettier runs from heat-stack/node_modules, so `npm install` must be done first.
# Run all hooks manually with:
#   uv run pre-commit run --all-files
minimum_pre_commit_version: "4.4.0"
repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node heat-stack/node_modules/prettier/bin/prettier.cjs --check --ignore-path heat-stack/.prettierignore
        language: system
        pass_filenames: false
        always_run: true
        files: ^heat-stack/
      - id: mypy
        name: mypy
        entry: uv run --directory python mypy . --exclude '(^|/)(build|dist|\.venv)/'
        language: system
        files: ^python/
        pass_filenames: false
      - id: pytest
        name: pytest before push
        entry: uv run --directory python pytest
        language: system
        types: [python]
        stages: [pre-push]
        pass_filenames: false
        exclude: ^heat-stack/app/pycode/